[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
solar-core = { path = "crates/solar-core" }
solar-ai = { path = "crates/solar-ai" }

dioxus = "0.7.10"
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
dirs = "6"
log = "0.4"
rfd = "0.17"
trash = "5"
arboard = { version = "3.6", default-features = false }
base64 = "0.22"
tempfile = "3"
toml = "1"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
