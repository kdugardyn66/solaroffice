# SolarOffice model catalog: what the AI layer knows about each hosted model.
#
# Used for the model picker, sensible max_tokens, capability checks (images, PDFs, tools) and
# cost estimates. Models not listed still work: any id a provider's /models endpoint returns can
# be used, with conservative defaults. Local providers (Ollama, LM Studio, OpenAI-compatible)
# are free and get their model list from the server.
#
# Prices: US dollars per million tokens, standard tier, taken from the providers' pricing pages
# on 2026-10-24. Check them before relying on cost estimates. `price_note` replaces the price
# label where the price isn't per token (images, characters) or isn't published.
#
# Categories (at most five per model, strongest first): reason, chat, write, translate, code,
# create (images/video), listen (speech-to-text), speak (text-to-speech), see (images in),
# predict (forecasting).
#
# Models are grouped by region: Europe, Asia-Pacific, North America. Aleph Alpha and Microsoft
# use the model (deployment) names of your own install, so they have few or no entries.
#   https://platform.claude.com/docs/en/models/overview
#   https://ai.google.dev/gemini-api/docs/pricing
#   https://developers.openai.com/api/docs/models/compare

